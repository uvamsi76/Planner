[package]
name = "planner"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
